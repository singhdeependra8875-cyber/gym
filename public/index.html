<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymDesk - Membership Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EE;--sf:#fff;--ink:#15201B;--mut:#5B6862;--ln:#D5DBD7;--pri:#0E5A49;--pt:#fff;--sn:#9A4A06;--sb:#FDEBD0;--ex:#B42318;--eb:#FCE4E1;--okb:#DDF1EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1512;--sf:#18211C;--ink:#E8EFEB;--mut:#93A39B;--ln:#2B3630;--pri:#3DBE9A;--pt:#08251D;--sn:#F5B454;--sb:#3A2A10;--ex:#FF8A80;--eb:#3B1A17;--okb:#123329}}
:root[data-theme="dark"]{--bg:#0F1512;--sf:#18211C;--ink:#E8EFEB;--mut:#93A39B;--ln:#2B3630;--pri:#3DBE9A;--pt:#08251D;--sn:#F5B454;--sb:#3A2A10;--ex:#FF8A80;--eb:#3B1A17;--okb:#123329}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 100px}
h1,h2,.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700}
h1{font-size:30px;margin:0}h2{font-size:22px;margin:24px 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
nav{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 15px Barlow,sans-serif;padding:10px 4px;border-radius:9px;cursor:pointer}
nav button.on{background:var(--pri);color:var(--pt)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
.st .num{font-size:44px;line-height:1}.st small{color:var(--mut);font-size:14px}
.st.soon .num{color:var(--sn)}.st.exp .num{color:var(--ex)}
.row{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.row.soon{border-left-color:var(--sn)}.row.exp{border-left-color:var(--ex)}.row.ok{border-left-color:var(--pri)}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}.who b{font-size:18px}.who span{color:var(--mut);font-size:14px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;width:fit-content;margin-top:2px}
.pill.soon{background:var(--sb);color:var(--sn)}.pill.exp{background:var(--eb);color:var(--ex)}.pill.ok{background:var(--okb);color:var(--pri)}
.acts{display:flex;gap:6px}
.btn{font:600 15px Barlow,sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;min-height:42px}
.btn.wa,.btn.pri{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.btn.bad{color:var(--ex)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));font-size:17px;padding:14px 20px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
input,select,textarea{width:100%;font:16px Barlow,sans-serif;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.chips .btn{padding:6px 12px;min-height:34px}.chips .btn.on{background:var(--pri);color:var(--pt)}
.empty{background:var(--sf);border:1px dashed var(--ln);border-radius:12px;padding:20px;text-align:center;color:var(--mut)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{font-size:14px;color:var(--mut);margin-top:8px}
.tag{color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;display:none;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
</style></head><body>
<main id="app"></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const validDate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s)))return false;const [y,m,d]=s.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d));return x.getUTCFullYear()===y&&x.getUTCMonth()===m-1&&x.getUTCDate()===d};
const addM=(s,n)=>{const d=parse(s),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return iso(d)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((parse(s)-parse(today()))/864e5);
const fd=s=>parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const DEF={gym:'My Gym',cc:'91',reminderDays:7,plans:[{id:'p1',name:'Monthly',m:1,price:1000},{id:'p2',name:'3 Months',m:3,price:2700},{id:'p3',name:'6 Months',m:6,price:5000},{id:'p4',name:'Yearly',m:12,price:9000}],t:{soon:'Hi {name}, your {gym} membership ends on {date}. Renew now and keep your routine going!',exp:'Hi {name}, your {gym} membership expired on {date}. Renew today and get back to training!',back:'Hi {name}, we miss you at {gym}! Come back this week and we will help you restart. Reply to this message to renew.'},members:[]};
let D=structuredClone(DEF),saveTimer=null,saveBusy=false,saveQueued=false;
let ui={tab:'home',q:'',f:'all',modal:null,del:false};

function toast(t){const e=$('#toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3000)}
function st(m){const d=diff(m.end);return{d,k:d<0?'exp':d<=7?'soon':'ok'}}
function lbl(d){return d<0?`Expired ${-d} day${d==-1?'':'s'} ago`:d==0?'Expires today':`Expires in ${d} day${d==1?'':'s'}`}
function fill(t,m){return String(t||'').replace(/{name}/g,m.name).replace(/{date}/g,fd(m.end)).replace(/{gym}/g,D.gym)}
function wa(m){let p=String(m.phone).replace(/\D/g,'');if(p.length===10)p=String(D.cc)+p;const s=st(m),t=s.d<0?(s.d<-30?D.t.back:D.t.exp):D.t.soon;return 'https://wa.me/'+encodeURIComponent(p)+'?text='+encodeURIComponent(fill(t,m))}
function reminderType(m){const d=diff(m.end),window=Number.isInteger(D.reminderDays)?D.reminderDays:7;if(d>=0&&d<=window)return'soon';if(d<0&&d>=-30)return'exp';if(d< -30)return'back';return''}
function reminderPrepared(m,type){const r=m.reminders?.[type];return r?.date===today()&&r?.end===m.end}

function clientValid(data){
  if(!data||typeof data!=='object'||Array.isArray(data)||!Array.isArray(data.members)||!Array.isArray(data.plans)||!data.plans.length||data.members.length>10000||data.plans.length>100)return false;
  if(typeof data.gym!=='string'||!data.gym.trim()||data.gym.length>100||!/^\d{1,4}$/.test(String(data.cc||'')))return false;
  if(!data.t||typeof data.t!=='object'||Array.isArray(data.t))return false;
  for(const k of ['soon','exp','back'])if(typeof data.t[k]!=='string'||data.t[k].length>2000)return false;
  if(!Number.isInteger(data.reminderDays)||data.reminderDays<0||data.reminderDays>60)return false;
  const pids=new Set();
  for(const p of data.plans){if(!p||typeof p!=='object'||!p.id||typeof p.id!=='string'||p.id.length>80||!p.name||typeof p.name!=='string'||p.name.length>100||pids.has(p.id)||!Number.isInteger(p.m)||p.m<1||p.m>120||!Number.isFinite(Number(p.price))||Number(p.price)<0||Number(p.price)>1e8)return false;pids.add(p.id)}
  const mids=new Set();
  for(const m of data.members){
    if(!m||typeof m!=='object'||!m.id||typeof m.id!=='string'||m.id.length>100||mids.has(m.id)||!m.name||typeof m.name!=='string'||m.name.length>150||typeof m.phone!=='string'||!/^\d{10}$/.test(m.phone)||!pids.has(m.plan)||!validDate(m.end))return false;
    mids.add(m.id);if(m.joined&&!validDate(m.joined))return false;if(m.rem!=null&&!validDate(m.rem))return false;
    if(m.reminders!=null){if(typeof m.reminders!=='object'||Array.isArray(m.reminders)||Object.keys(m.reminders).some(k=>!['soon','exp','back'].includes(k)))return false;for(const r of Object.values(m.reminders))if(!r||typeof r!=='object'||Array.isArray(r)||!validDate(r.date)||!validDate(r.end))return false}
    if(m.h!=null&&!Array.isArray(m.h))return false;if(Array.isArray(m.h)&&m.h.length>1000)return false;
    for(const h of (m.h||[])){if(!h||typeof h!=='object'||!validDate(h.date)||typeof h.plan!=='string'||!h.plan||(h.mode!=null&&!['Cash','UPI','Card'].includes(h.mode))||!Number.isFinite(Number(h.amt))||Number(h.amt)<0||Number(h.amt)>1e8)return false}
  }
  return true;
}

async function saveNow(){clearTimeout(saveTimer);saveBusy=true;saveQueued=false;try{if(!clientValid(D)){toast('Please fix the data before saving.');return false}const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});if(r.status===401){location.reload();return false}if(!r.ok){toast('Could not save. Please try again.');return false}return true}catch(e){toast('Could not save. Check the server.');return false}finally{saveBusy=false;if(saveQueued)save()}}
function save(){clearTimeout(saveTimer);saveQueued=true;saveTimer=setTimeout(saveNow,350)}

const row=m=>{const s=st(m),p=D.plans.find(x=>x.id===m.plan);return `<div class="row ${s.k}"><div class="who"><b>${esc(m.name)}</b><span>${esc(m.phone)}</span><span class="pill ${s.k}">${lbl(s.d)}</span><span>${esc(p?p.name:'Plan')} plan, ends ${fd(m.end)}${m.rem===today()?'. Reminded today':''}</span></div><div class="acts"><a class="btn wa" target="_blank" rel="noopener noreferrer" data-rem="${esc(m.id)}" href="${wa(m)}">WhatsApp</a><button class="btn" data-act="edit" data-id="${esc(m.id)}">Edit</button><button class="btn pri" data-act="renew" data-id="${esc(m.id)}">Renew</button></div></div>`};
const list=a=>a.length?a.map(row).join(''):'';
function home(){const ms=D.members,soon=ms.filter(m=>st(m).k==='soon').sort((a,b)=>a.end.localeCompare(b.end)),exp=ms.filter(m=>st(m).k==='exp').sort((a,b)=>b.end.localeCompare(a.end));const col=ms.flatMap(m=>m.h||[]).filter(h=>h.date===today()).reduce((a,h)=>a+Number(h.amt||0),0),ym=today().slice(0,7),monthCol=ms.flatMap(m=>m.h||[]).filter(h=>String(h.date||'').slice(0,7)===ym).reduce((a,h)=>a+Number(h.amt||0),0);if(!ms.length)return `<div class="empty"><p><b>No members yet.</b></p><p>Add your first member to start tracking renewals.</p><button class="btn pri" data-act="add">Add member</button> <button class="btn" data-act="demo">Load sample data</button></div>`;return `<div class="stats"><div class="st soon"><div class="num">${soon.length}</div><small>Expiring in 7 days</small></div><div class="st exp"><div class="num">${exp.length}</div><small>Expired</small></div><div class="st"><div class="num">${ms.length-exp.length}</div><small>Active members</small></div><div class="st"><div class="num">${col.toLocaleString('en-IN')}</div><small>Collected today (Rs)</small></div><div class="st"><div class="num">${monthCol.toLocaleString('en-IN')}</div><small>Collected this month (Rs)</small></div></div><h2>Expiring soon</h2>${list(soon)||'<div class="empty">Nobody is expiring this week.</div>'}<h2>Expired, send a message</h2>${list(exp.slice(0,30))||'<div class="empty">No expired members.</div>'}`}
function mlist(){let a=D.members.slice().sort((x,y)=>x.end.localeCompare(y.end));const q=ui.q.trim().toLowerCase();if(q)a=a.filter(m=>m.name.toLowerCase().includes(q)||m.phone.includes(q));if(ui.f!=='all')a=a.filter(m=>st(m).k===(ui.f==='active'?'ok':ui.f));return list(a)||'<div class="empty">No members found.</div>'}
function members(){return `<input id="q" type="search" placeholder="Search name or number" value="${esc(ui.q)}"><div class="chips">${[['all','All'],['ok','Active'],['soon','Expiring'],['exp','Expired']].map(([k,l])=>`<button class="btn ${ui.f===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div><div id="list">${mlist()}</div>`}
function reminderRow(m,type){const labels={soon:'Expiring Soon',exp:'Expired',back:'Come Back'},prepared=reminderPrepared(m,type),rowClass=type==='back'?'ok':type;return `<div class="row ${rowClass}"><div class="who"><b>${esc(m.name)}</b><span>${esc(m.phone)}</span><span class="pill ${rowClass}">${labels[type]}</span><span>Expires ${fd(m.end)}</span><small class="tag" data-prepared>${prepared?'Prepared today':''}</small></div><div class="acts"><a class="btn wa" target="_blank" rel="noopener noreferrer" data-rem="${esc(m.id)}" data-rem-type="${type}" href="${esc(wa(m))}">Send WhatsApp</a></div></div>`}
function reminderGroup(type,title){const list=D.members.filter(m=>reminderType(m)===type).sort((a,b)=>a.end.localeCompare(b.end));return `<h3>${title}</h3>${list.length?list.map(m=>reminderRow(m,type)).join(''):'<div class="empty">No members need a reminder today.</div>'}`}
function reminderCenter(){return `<h2>Reminder Center</h2>${reminderGroup('soon','Expiring Soon')}${reminderGroup('exp','Expired')}${reminderGroup('back','Come Back')}`}
function msgs(){const f=(k,l)=>`<label>${l}</label><textarea data-t="${k}">${esc(D.t[k])}</textarea>`;return `${reminderCenter()}<h2>Message templates</h2><p class="tag">Use {name}, {date} and {gym}. The WhatsApp button picks the right message automatically.</p>${f('soon',`Before expiry (within ${D.reminderDays} day${D.reminderDays===1?'':'s'})`)}${f('exp','Just expired (up to 30 days)')}${f('back','Come back (expired over 30 days)')}`}
function sets(){return `<label>Gym name</label><input data-s="gym" maxlength="100" value="${esc(D.gym)}"><label>Country code for 10-digit numbers</label><input data-s="cc" maxlength="4" value="${esc(D.cc)}" inputmode="numeric"><h2>Reminders</h2><label>Expiring soon reminder window (days)</label><input data-s="reminderDays" type="number" min="0" max="60" step="1" value="${Number(D.reminderDays)}"><h2>Plans and prices (Rs)</h2>${D.plans.map(p=>`<div class="two"><input data-pn="${esc(p.id)}" maxlength="100" value="${esc(p.name)}"><input data-pp="${esc(p.id)}" type="number" min="0" max="100000000" step="1" value="${Number(p.price)}"></div>`).join('')}<h2>Backup</h2><p class="tag">Data is saved on the server and works from any phone. Export a backup now and then for extra safety.</p><button class="btn" data-act="export">Export backup</button> <button class="btn" data-act="import">Restore from text below</button><textarea id="bk" placeholder="Backup text appears here after export."></textarea><h2>Security</h2><h3>Change Owner Password</h3><label>Current password</label><input id="pw-current" type="password" autocomplete="current-password" maxlength="256"><label>New password</label><input id="pw-new" type="password" autocomplete="new-password" minlength="8" maxlength="256"><label>Confirm new password</label><input id="pw-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256"><p><button class="btn" data-act="change-password">Change Password</button></p><h2>Account</h2><button class="btn" data-act="logout">Log out</button>`}
function modal(){const md=ui.modal;if(!md)return'';const m=md.id?D.members.find(x=>x.id===md.id):null;if(md.id&&!m){ui.modal=null;ui.del=false;return''}const renewing=md.mode==='renew',pid=m?m.plan:D.plans[0].id,pl=D.plans.find(p=>p.id===pid)||D.plans[0];return `<div class="veil"><div class="sheet"><h2 style="margin-top:0">${m?(renewing?'Renew member':'Edit member'):'Add member'}</h2><label>Name</label><input id="f-name" maxlength="150" value="${esc(m?m.name:'')}"><label>WhatsApp number</label><input id="f-phone" inputmode="numeric" value="${esc(m?m.phone:'')}" placeholder="10-digit number" maxlength="10">${(!m||renewing)?`<div class="two"><div><label>Plan</label><select id="f-plan">${D.plans.map(p=>`<option value="${esc(p.id)}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>Amount paid (Rs)</label><input id="f-amt" type="number" min="0" max="100000000" step="1" value="${Number(pl.price)}"></div></div><label>Start date</label><input id="f-start" type="date" value="${esc(m&&m.end>today()?m.end:today())}"><label>Payment mode</label><select id="f-mode"><option>Cash</option><option>UPI</option><option>Card</option></select>`:''}${m?`<p class="hist">Current end date: ${fd(m.end)}. Payments so far: ${(m.h||[]).length}</p>${(m.h||[]).length?`<details><summary>View payment history</summary><div class="hist">${m.h.slice().reverse().map(h=>`${esc(h.date)} · ${esc(h.plan)} · Rs ${Number(h.amt||0).toLocaleString('en-IN')} · ${esc(h.mode||'—')}`).join('<br>')}</div></details>`:''}`:''}<div style="display:flex;gap:8px;margin-top:16px"><button class="btn pri" style="flex:1" data-act="save">${m?(renewing?'Save renewal':'Save changes'):'Add member'}</button>${m?'':'<button class="btn" data-act="savenext">Save and add next</button>'}<button class="btn" data-act="close">Cancel</button></div>${m?`<button class="btn bad" style="margin-top:10px" data-act="del">${ui.del?'Tap again to delete':'Delete member'}</button>`:''}</div></div>`}
function render(){const T=[['home','Home'],['members','Members'],['msgs','Messages'],['sets','Settings']];$('#app').innerHTML=`<header><h1>${esc(D.gym)}</h1></header><nav>${T.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</nav>${({home,members,msgs,sets})[ui.tab]()}<button class="btn pri fab" data-act="add">+ Add member</button>${modal()}`}

function closeModal(){ui.modal=null;ui.del=false;render()}
function currentMember(){return ui.modal?.id?D.members.find(x=>x.id===ui.modal.id):null}
function addOrRenew(action){
  const name=$('#f-name')?.value.trim(),rawPhone=$('#f-phone')?.value.trim()||'',phone=rawPhone.replace(/\D/g,''),m=currentMember();
  if(!name||phone.length!==10)return toast('Enter a name and exactly 10-digit WhatsApp number');
  if(m&&ui.modal.mode==='edit'){m.name=name;m.phone=phone;save();closeModal();toast('Member details updated');return}
  const p=D.plans.find(x=>x.id===$('#f-plan')?.value);if(!p)return toast('Select a valid plan');
  const start=$('#f-start')?.value||today();if(!validDate(start))return toast('Choose a valid start date');
  const amt=Number($('#f-amt')?.value);if(!Number.isFinite(amt)||amt<0||amt>1e8)return toast('Enter a valid payment amount');
  const mode=$('#f-mode')?.value;if(!['Cash','UPI','Card'].includes(mode))return toast('Select a valid payment mode');
  const target=m||{id:'m'+Date.now()+'-'+Math.random().toString(36).slice(2,8),joined:today(),h:[]};
  Object.assign(target,{name,phone,plan:p.id,end:addM(start,p.m),rem:null});
  if(!m)D.members.push(target);
  (target.h=target.h||[]).push({date:today(),plan:p.name,amt,mode});
  save();ui.modal=action==='savenext'?{}:null;ui.del=false;render();toast(m?'Renewal saved. Ends '+fd(target.end):'Saved. Ends '+fd(target.end));
}

function importBackup(){
  try{
    const raw=$('#bk').value.trim();if(!raw)return toast('Paste a backup first');
    const j=JSON.parse(raw);const candidate={...structuredClone(DEF),...j};
    if(!clientValid(candidate))throw new Error('invalid');
    const old=D;D=candidate;
    saveNow().then(ok=>{if(ok){ui.tab='home';render();toast('Backup restored')}else{D=old;render()}});
  }catch(e){toast('That backup is not valid')}
}

document.addEventListener('click',e=>{
  if(e.target.classList.contains('veil'))return closeModal();
  const r=e.target.closest('[data-rem]');
  if(r){const m=D.members.find(x=>x.id===r.dataset.rem),type=r.dataset.remType;if(m){if(type){if(reminderPrepared(m,type)&&!confirm('This reminder was already prepared today. Open WhatsApp again?')){e.preventDefault();return}m.reminders=m.reminders||{};m.reminders[type]={date:today(),end:m.end};const status=r.closest('.row')?.querySelector('[data-prepared]');if(status)status.textContent='Prepared today';r.href=wa(m)}m.rem=today();save()}return;}
  const t=e.target.closest('[data-tab],[data-f],[data-act]');if(!t)return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;return render()}
  if(t.dataset.f){ui.f=t.dataset.f;return render()}
  const a=t.dataset.act;
  if(a==='add'){ui.modal={};ui.del=false;render()}
  else if(a==='edit'){ui.modal={id:t.dataset.id,mode:'edit'};ui.del=false;render()}
  else if(a==='renew'){ui.modal={id:t.dataset.id,mode:'renew'};ui.del=false;render()}
  else if(a==='close')closeModal();
  else if(a==='save'||a==='savenext')addOrRenew(a);
  else if(a==='del'){if(!ui.del){ui.del=true;return render()}D.members=D.members.filter(x=>x.id!==ui.modal.id);save();closeModal();toast('Member deleted')}
  else if(a==='demo'){const s=[['Rahul Sharma',2,'p1'],['Priya Verma',5,'p2'],['Amit Jain',-3,'p1'],['Neha Gupta',-12,'p3'],['Vikram Singh',-45,'p1'],['Sneha Rao',30,'p4']];s.forEach(([n,d,p],i)=>D.members.push({id:'d'+Date.now()+i,name:n,phone:'99999000'+(10+i),plan:p,joined:today(),end:addD(today(),d),h:[{date:today(),plan:'Sample',amt:1000,mode:'Cash'}]}));save();render();toast('Sample data loaded. These numbers are fake, delete them before real use.')}
  else if(a==='export'){const j=JSON.stringify(D,null,2),box=$('#bk');if(box){box.value=j;box.focus();box.select()}const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download='gymdesk-backup-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1000)}
  else if(a==='import')importBackup();
  else if(a==='change-password'){
    const currentPassword=$('#pw-current')?.value||'',newPassword=$('#pw-new')?.value||'',confirmationPassword=$('#pw-confirm')?.value||'';
    if(!currentPassword)return toast('Enter your current password');
    if(newPassword.length<8||newPassword.length>256)return toast('New password must be 8 to 256 characters');
    if(newPassword!==confirmationPassword)return toast('New password and confirmation do not match');
    if(newPassword===currentPassword)return toast('Choose a password different from the current password');
    t.disabled=true;
    fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword,newPassword,confirmationPassword})})
      .then(async r=>({r,data:await r.json().catch(()=>({}))}))
      .then(({r,data})=>{if(r.ok){login();toast('Password changed. Please log in again.')}else if(r.status===401&&data.error==='Login required'){login();toast('Your session expired. Please log in again.')}else toast(data.error||'Could not change the password. Try again.')})
      .catch(()=>toast('Could not reach the server. Please try again.'))
      .finally(()=>{if(document.body.contains(t))t.disabled=false});
  }
  else if(a==='logout'){saveNow().then(ok=>{if(!ok)return;return fetch('/api/logout',{method:'POST'})}).then(r=>{if(r&&r.ok)location.reload()}).catch(()=>toast('Could not log out. Try again.'))}
});

function settingsInput(t){
  if(t.dataset.t){D.t[t.dataset.t]=t.value.slice(0,2000);save();return}
  if(t.dataset.s){if(t.dataset.s==='cc'){t.value=t.value.replace(/\D/g,'').slice(0,4);D.cc=t.value||'91'}else if(t.dataset.s==='reminderDays'){const days=Number(t.value);if(!Number.isInteger(days)||days<0||days>60){t.value=String(D.reminderDays);return toast('Choose a reminder window from 0 to 60 days')}D.reminderDays=days}else{D[t.dataset.s]=t.value.slice(0,100)}save();return}
  if(t.dataset.pn){const p=D.plans.find(x=>x.id===t.dataset.pn);if(p){p.name=t.value.slice(0,100);save()}return}
  if(t.dataset.pp){const p=D.plans.find(x=>x.id===t.dataset.pp);if(p){p.price=Math.max(0,Math.min(1e8,Number(t.value)||0));save()}}
}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){ui.q=t.value;const listEl=$('#list');if(listEl)listEl.innerHTML=mlist();return}if(t.id==='f-phone')t.value=t.value.replace(/\D/g,'').slice(0,10);if(t.dataset.s==='reminderDays')return;settingsInput(t)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='f-plan'){const p=D.plans.find(x=>x.id===t.value);if(p)$('#f-amt').value=p.price}else settingsInput(t)});

async function init(){const r=await fetch('/api/data').catch(()=>null);if(!r){$('#app').innerHTML='<div class="empty">Cannot reach the server. Check your internet and reload.</div>';return}if(r.status===401)return login();if(!r.ok){$('#app').innerHTML='<div class="empty">The saved data could not be loaded safely. Check the server log.</div>';return}const j=await r.json();const candidate={...structuredClone(DEF),...(j||{})};if(!clientValid(candidate)){toast('The saved data is invalid. Please restore a valid backup.');D=structuredClone(DEF)}else D=candidate;render()}
function login(){
  $('#app').innerHTML='<h1>GymDesk</h1><label>Owner password</label><input id="pw" type="password" autocomplete="current-password" maxlength="256"><p><button class="btn pri" id="go">Log in</button></p>';
  const go=async()=>{const pw=$('#pw').value,r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).catch(()=>null);if(r&&r.ok)init();else toast(r&&r.status===429?'Too many attempts. Wait 15 minutes.':r?'Wrong password':'Cannot reach server')};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};$('#pw').focus();
}
window.addEventListener('beforeunload',e=>{if(saveTimer||saveBusy||saveQueued){e.preventDefault();e.returnValue='';}});
init();
</script></body></html>
